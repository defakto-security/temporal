# Reference config a customer copies into their ConfigMap and edits.
# Mounted into the container; its path is passed via DEFAKTO_SPIFFE_TEMPORAL_CONFIG.
apiVersion: v1
kind: ConfigMap
metadata:
  name: defakto-spiffe-temporal
data:
  # The module config contract (see config/config.go).
  config.yaml: |
    version: 1
    trustDomain: corp.defakto.security
    # Leading literal segment is the human/service prefix test key.
    devIDTemplate: "/users/{domain}/{username}"
    # Milestone 2 (Temporal Web): portal-issued OIDC verification.
    human:
      issuer: https://devportal.corp.defakto.security/
      audience: temporal
      jwksURL: https://devportal.corp.defakto.security/.well-known/jwks.json
    # Principal attributes a policy can read as `principal.<name>`. Defaults
    # (shown) parse spiffe://<td>/ns/<ns>/sa/<sa>. Add your own, or override a
    # default by reusing its name. Each value is an RE2 regex with exactly ONE
    # capture group. A pattern is anchored at both ends and must match the WHOLE
    # SPIFFE ID (use `.*` for the parts you ignore). No match gives "".
    # attributes:
    #   trust_domain: 'spiffe://([^/]+)(?:/.*)?'
    #   ns:           'spiffe://[^/]+/ns/([^/]+)/sa/[^/]+'
    #   sa:           'spiffe://[^/]+/ns/[^/]+/sa/([^/]+)'
    #   nameSpace:    'spiffe://[^/]+/k8s/([^/]+)/.*'
    policyPath: /etc/defakto-spiffe-temporal/policy.cedar
    # Rollout aids. decisionLog: off (default) | deny | all. "all" logs every
    # decision with principal, attributes, namespace, API and verb.
    # decisionLog: all
    # identityMode: enforce (default) | observe. Before any policy runs, a call
    # needs an authenticated caller with a role class and a canonical SPIFFE ID
    # in trustDomain. "observe" lets a call that fails these through and logs
    # as `would_deny`, and counts it as decision="allow" with a reason (unauthenticated,
    # unknown_role_class, malformed_subject). Run it until none appear, then
    # switch to enforce. Policy decisions are always enforced, and forbidden-all,
    # break-glass and unclassified APIs stay denied. Observe is no stricter than
    # having no authorizer: turn it off once callers are identified.
    # identityMode: observe
    # A candidate policy. Every call is also checked against it; the live
    # decision still wins. Disagreements are logged: `would_deny` (live allowed,
    # candidate denies) and `would_allow` (live denied, candidate allows). The
    # metric shows a disagreement as shadow_decision="delta". Must differ from policyPath.
    # shadowPolicyPath: /etc/defakto-spiffe-temporal/policy.next.cedar

  # The customer-owned Cedar policy. This copy is the shipped reference
  # (destruction verbs forbidden by default); edit to set your own floor.
  policy.cedar: |
    permit (principal in RoleClass::"service",
            action in [Action::"start-signal", Action::"worker"], resource);
    permit (principal in RoleClass::"human",
            action == Action::"read-only", resource);
    forbid (principal, action == Action::"forbidden-all", resource);
