name: ci

on:
  pull_request:
  push:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  golang:
    runs-on:
      - runs-on=${{ github.run_id }}
      - runner=2cpu-linux-arm64
      - spot=false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so golangci-lint --new-from-rev can diff against the base.
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4

      - name: vet
        run: mise run vet

      - name: test
        run: mise run test

      # Full config, but only fail on issues in code changed since the base branch.
      # Existing findings are grandfathered; new code must be clean.
      - name: lint (new code)
        run: mise exec -- golangci-lint run --new-from-rev=origin/${{ github.base_ref || 'main' }} --timeout=3m

  all-green:
    needs: [ golang ]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          GOLANG: ${{ needs.golang.result }}
        run: |
          must_pass() {
            [ "$2" = "success" ] && return 0
            echo "::error::$1 = $2"
            return 1
          }
          rc=0
          must_pass golang "$GOLANG" || rc=1
          exit $rc
