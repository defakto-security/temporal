name: publish

on:
  push:
    branches:
      - "main"

# On main, publish every commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Public image for the custom SPIFFE/Cedar Temporal server build.
  # This repo is first-party to the defakto-security org, so the workflow's own
  # GITHUB_TOKEN can write ghcr.io/defakto-security/* directly — no PAT, no
  # machine user, no AWS OIDC role (unlike spirl's defakto-assess release, which
  # pushes cross-org and must use a classic PAT).
  IMAGE: ghcr.io/defakto-security/temporal
  IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}

jobs:
  publish:
    permissions:
      contents: read # required for actions/checkout
      packages: write # required to push to ghcr.io/defakto-security/*
    runs-on:
      - runs-on=${{ github.run_id }}
      - runner=2cpu-linux-arm64
      - spot=false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4

      - name: Log in to ghcr.io
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build and push image to GHCR
        run: make build push
