name: publish

on:
  push:
    branches:
      - "main"

# On main, publish every commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # ECR repository for the defakto-spiffe-temporal image. Provisioned by corp-infra.
  # TODO: set to the real ECR URI once the repo is provisioned (FRY-1371).
  IMAGE: 242071452677.dkr.ecr.us-east-1.amazonaws.com/defakto-spiffe-temporal
  IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}

jobs:
  publish:
    permissions:
      id-token: write # required for requesting the OIDC JWT
      contents: read # required for actions/checkout
    runs-on:
      - runs-on=${{ github.run_id }}
      - runner=2cpu-linux-arm64
      - spot=false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          role-session-name: "gh-actions-defakto-spiffe-temporal-publish"
          aws-region: us-east-1

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build and push image to ECR
        run: make build push
